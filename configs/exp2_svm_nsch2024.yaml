# Classical RBF-SVM baseline on the identical Experiment 2 folds, regimes and feature sets.
project:
  name: exp2-nsch2024-svm-baseline
  seed: 2026
  output_dir: results
  n_jobs: 2
data:
  loader: nsch
  paths:
  - data/raw/nsch_2024/nsch_2024e_topical.dta
  target: depression_current
  min_age: 12
  max_age: 17
split:
  holdout_fraction: 0.2
cv:
  n_splits: 5
  n_repeats: 3
subsample:
  n: 1500
tuning:
  inner_val_fraction: 0.2
experiment:
  regimes:
  - subsample
  - full
  feature_sets:
    pca4:
      method: pca
      k: 4
    pca8:
      method: pca
      k: 8
    all95:
      method: all
  classical_models:
  - svm
  quantum: {}
base_params: {}
grids:
  svm:
    C:
    - 0.1
    - 1.0
    - 10.0
skip_report: true
