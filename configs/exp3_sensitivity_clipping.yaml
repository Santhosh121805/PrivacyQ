# Sensitivity analysis (added after seeing Exp3): LogReg DP clipping norm.
project:
  name: exp3-sensitivity-logreg-clipping
  seed: 2026
  output_dir: results
  n_jobs: 6
data:
  loader: nsch
  paths:
  - data/raw/nsch_2024/nsch_2024e_topical.dta
  target: depression_current
  min_age: 12
  max_age: 17
split:
  holdout_fraction: 0.2
cv:
  n_splits: 5
  n_repeats: 2
subsample:
  n: 1500
tuning:
  inner_val_fraction: 0.2
experiment:
  epsilons:
  - 0.5
  - 1
  - 2
  - 4
  - 8
  - null
  delta: 1.0e-05
  feature_sets:
    pca4:
      method: pca
      k: 4
    all95:
      method: all
  arms:
    logreg_sub_clip1:
      label: LogReg same rows, clip 1
      kind: logreg
      family: classical
      regime: subsample
      feature_set: pca4
      learning_rate: 0.05
      epochs: 30
      batch_size: 128
      max_grad_norm: 1.0
    logreg_sub_clip5:
      label: LogReg same rows, clip 5
      kind: logreg
      family: classical
      regime: subsample
      feature_set: pca4
      learning_rate: 0.05
      epochs: 30
      batch_size: 128
      max_grad_norm: 5.0
    logreg_sub_clip10:
      label: LogReg same rows, clip 10
      kind: logreg
      family: classical
      regime: subsample
      feature_set: pca4
      learning_rate: 0.05
      epochs: 30
      batch_size: 128
      max_grad_norm: 10.0
  comparisons: []
