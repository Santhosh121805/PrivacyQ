# Experiment 1 extension: basis encoding on the same 10 folds, models, grids and qubit counts as
# configs/exp1_nsch2024_final.yaml (the diagram's fourth named encoding).
project:
  name: exp1-nsch2024-basis-encoding
  seed: 2026
  output_dir: results
  n_jobs: 6
data:
  loader: nsch
  paths:
  - data/raw/nsch_2024/nsch_2024e_topical.dta
  target: depression_current
  min_age: 12
  max_age: 17
split:
  holdout_fraction: 0.2
cv:
  n_splits: 5
  n_repeats: 2
subsample:
  n: 1500
tuning:
  inner_val_fraction: 0.2
experiment:
  models:
  - vqc
  - qsvm
  encodings:
  - basis
  qubits:
  - 4
  - 6
  - 8
  feature_methods:
  - mi
  - pca
base_params:
  vqc:
    epochs: 30
    batch_size: 64
    init_scale: 0.1
grids:
  qsvm:
    C:
    - 0.1
    - 1.0
    - 10.0
  vqc:
    learning_rate:
    - 0.01
    - 0.05
    n_layers:
    - 1
    - 2
