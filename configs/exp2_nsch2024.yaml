# Experiment 2: quantum vs classical on REAL data (NSCH 2024, ages 12-17). No privacy.
# Quantum configurations = best per family in Experiment 1 (rule: highest mean ROC-AUC),
# see results/exp1-nsch2024-encodings-final-20261108-160825/summary.csv.
project:
  name: exp2-nsch2024-quantum-vs-classical
  seed: 2026              # same hold-out and folds as Phase 1 / Experiment 1
  output_dir: results
  n_jobs: 6

data:
  loader: nsch
  paths: [data/raw/nsch_2024/nsch_2024e_topical.dta]
  target: depression_current
  min_age: 12
  max_age: 17

split:
  holdout_fraction: 0.2

cv:
  n_splits: 5
  n_repeats: 3

subsample:
  n: 1500

tuning:
  inner_val_fraction: 0.2

experiment:
  regimes: [subsample, full]
  feature_sets:
    pca4: {method: pca, k: 4}
    pca8: {method: pca, k: 8}
    all95: {method: all}
  classical_models: [logreg, xgboost, mlp]   # RandomForest dropped on supervisor instruction
  quantum:
    qsvm: {feature_set: pca8, encoding: angle, n_qubits: 8, grid: {C: [0.1, 1.0, 10.0]}}
    vqc: {feature_set: pca4, encoding: reupload, n_qubits: 4, epochs: 30, batch_size: 64, init_scale: 0.1,
          grid: {learning_rate: [0.01, 0.05], n_layers: [1, 2]}}
    hybrid: {feature_set: all95, encoding: angle, n_qubits: 8, n_layers: 2, epochs: 30, batch_size: 64,
             init_scale: 0.1, grid: {learning_rate: [0.01, 0.05]}}

base_params:
  xgboost: {n_estimators: 300}
  mlp: {epochs: 60, batch_size: 128}

grids:
  logreg: {C: [0.01, 0.1, 1.0, 10.0]}
  xgboost: {max_depth: [2, 4, 6], learning_rate: [0.03, 0.1]}
  mlp: {hidden: [[32], [64, 32]], weight_decay: [0.0001, 0.01]}

resume:
  run_dir: results/exp2-nsch2024-quantum-vs-classical-20261108-161435
  models: [hybrid, vqc, mlp]
